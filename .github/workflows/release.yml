name: Build & Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.1, v1.0.2, etc.

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist-electron/Mwalimu-POS-Setup-*.exe
            dist-electron/Mwalimu-POS-Setup-*.exe.blockmap
            dist-electron/latest.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install npm dependencies
        run: npm ci

      - name: Build for Linux
        run: npm run build:linux
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist-electron/*.AppImage
            dist-electron/latest-linux.yml
          if-no-files-found: ignore

  publish-release:
    needs: [build-windows, build-linux]
    if: ${{ needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      - name: Download Linux release files
        if: ${{ needs.build-linux.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets/linux

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/windows/*
            release-assets/linux/*

